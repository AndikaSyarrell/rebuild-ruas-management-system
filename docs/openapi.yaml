          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/activities/dashboard:
    get:
      tags: [Activity]
      summary: Feed aktivitas status-changing terbaru lintas PO
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ActivityResponse" }

  # =========================================================
  # DOCUMENT
  # =========================================================
  /api/po/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [Document]
      summary: List dokumen PO
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DocumentResponse" }
    post:
      tags: [Document]
      summary: Upload dokumen PO
      description: >
        Butuh access_slug: `upload_document`. Multipart/form-data.
        Format: pdf, doc, docx, jpg, jpeg, png, gif (maks 10MB). Isi file
        divalidasi via magic number, bukan cuma ekstensi nama file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  description: Opsional, default nama file asli
      responses:
        "201":
          description: Dokumen berhasil diunggah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          document_id: { type: integer }
                          file: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/po/{id}/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Document]
      summary: Hapus dokumen PO
      description: "Butuh access_slug: `upload_document`"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================
  # DASHBOARD
  # =========================================================
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Ringkasan dashboard (jumlah per status + PO terbuka terbaru)
      parameters:
        - name: region
          in: query
          schema: { type: integer }
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DashboardSummaryResponse" }

  # =========================================================
  # REPORT
  # =========================================================
  /api/reports/years:
    get:
      tags: [Report]
      summary: Daftar tahun yang memiliki data PO
      description: >
        Butuh access_slug: `view_report_table`.
        Dipakai untuk mengisi dropdown filter tahun di halaman chart/bars -
        hanya mengembalikan tahun yang benar-benar punya data PO (bukan range
        tahun statis), terurut dari yang paling baru.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          years:
                            type: array
                            items: { type: integer }
                            example: [2026, 2025, 2024]
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/chart:
    get:
      tags: [Report]
      summary: Data chart jumlah PO per tanggal
      description: >
        Butuh access_slug: `view_report_table`.


        **Prioritas filter tanggal:**
        1. Jika `start_date` DAN `end_date` sama-sama diisi → filter memakai
           rentang tanggal tersebut apa adanya (inklusif), parameter `year`
           diabaikan untuk filtering (tetap boleh dikirim, hanya dicatat di
           response).
        2. Jika `year` diisi (dan salah satu/kedua `start_date`/`end_date`
           kosong) → filter memakai 1 tahun kalender penuh dari `year`
           tersebut.
        3. Jika tidak ada parameter tanggal sama sekali → default ke tahun
           PO paling baru (lihat `GET /api/reports/years` untuk daftar
           pilihannya).


        Mengirim hanya salah satu dari `start_date`/`end_date` (tanpa
        pasangannya) akan ditolak dengan `400`.
      parameters:
        - name: year
          in: query
          description: Filter 1 tahun kalender penuh. Diabaikan jika start_date & end_date diisi lengkap.
          schema: { type: integer, example: 2026 }
        - name: start_date
          in: query
          description: Wajib diisi bersamaan dengan end_date.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Wajib diisi bersamaan dengan start_date.
          schema: { type: string, format: date }
        - name: region
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          year:
                            type: integer
                            description: Tahun yang benar-benar dipakai untuk filter. Bernilai 0 jika filter memakai start_date/end_date (bukan year).
                            example: 2026
                          start_date:
                            type: string
                            format: date
                            description: Kosong jika filter memakai year (bukan date-scope eksplisit).
                          end_date:
                            type: string
                            format: date
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string, format: date }
                                total: { type: integer }
        "400":
          description: start_date/end_date tidak lengkap (hanya salah satu yang diisi)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    example:
                      success: false
                      message: "start_date dan end_date harus diisi bersamaan"
                      data: null
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/bars:
    get:
      tags: [Report]
      summary: Data grafik total nilai PO per region
      description: >
        Butuh access_slug: `view_report_table`.
        Aturan prioritas filter tanggal (`year` vs `start_date`/`end_date`)
        sama persis seperti `GET /api/reports/chart` - lihat deskripsi di
        endpoint tersebut.
      parameters:
        - name: year
          in: query
          description: Filter 1 tahun kalender penuh. Diabaikan jika start_date & end_date diisi lengkap.
          schema: { type: integer, example: 2026 }
        - name: start_date
          in: query
          description: Wajib diisi bersamaan dengan end_date.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Wajib diisi bersamaan dengan start_date.
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          year:
                            type: integer
                            description: Tahun yang benar-benar dipakai untuk filter. Bernilai 0 jika filter memakai start_date/end_date (bukan year).
                            example: 2026
                          start_date:
                            type: string
                            format: date
                          end_date:
                            type: string
                            format: date
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                region_id:
                                  type: integer
                                  description: 0 jika PO tidak lagi terhubung ke region manapun (region sudah terhapus).
                                region_title:
                                  type: string
                                  description: String kosong jika region_id 0 (lihat catatan di atas).
                                total_amount: { type: number, format: double }
        "400":
          description: start_date/end_date tidak lengkap (hanya salah satu yang diisi)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    example:
                      success: false
                      message: "start_date dan end_date harus diisi bersamaan"
                      data: null
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/stats:
    get:
      tags: [Report]
      summary: Statistik PO per region (breakdown per status)
      description: >
        Butuh access_slug: `view_report_table`.
        Endpoint ini TIDAK mendukung filter tahun/tanggal - selalu
        mengagregasi seluruh data PO (opsional dibatasi per PIC lewat
        `acsg_pic`).
      parameters:
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            region_id: { type: integer }
                            region_title: { type: string }
                            total_po: { type: integer }
                            total_open: { type: integer }
                            total_prepared: { type: integer }
                            total_progress: { type: integer }
                            total_complete: { type: integer }
                            total_cancel: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

# =========================================================
# COMPONENTS
# =========================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPage:
      name: item
      in: query
      description: Jumlah item per halaman (maks 200)
      schema: { type: integer, default: 10, maximum: 200 }
    IdPathInt:
      name: id
      in: path
      required: true
      schema: { type: integer }
    IdPathString:
      name: id
      in: path
      required: true
      schema: { type: string }
    PoIdPath:
      name: id
      in: path
      required: true
      description: PO ID (format sequential, mis. PO250716123045-A1B2)
      schema: { type: string }

  responses:
    OK:
      description: Berhasil
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Created:
      description: Berhasil dibuat
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    BadRequest:
      description: Permintaan tidak valid (validasi gagal)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Unauthorized:
      description: Tidak terautentikasi (token hilang/invalid/expired)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Forbidden:
      description: Tidak memiliki hak akses (access_slug tidak dimiliki role)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    RegionListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RegionResponse" }
    DivisionListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DivisionResponse" }
    UnitListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnitResponse" }

  schemas:
    # --- generic wrappers ---
    ApiResponseBase:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
      example:
        success: true
        message: "Fetch success"
        data: {}

    PaginationMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            total_data: { type: integer }
            total_page: { type: integer }
            page: { type: integer }

    ReadyzResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            database: { type: string, example: "ok" }
            redis: { type: string, example: "ok" }

    # --- auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPairResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: "Bearer" }
        expires_in: { type: integer, description: "detik" }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPairResponse"
        - type: object
          properties:
            admin: { $ref: "#/components/schemas/AdminResponse" }

    ResetPasswordRequest:
      type: object
      required: [old_password, new_password, confirm_password]
      properties:
        old_password: { type: string, format: password }
        new_password: { type: string, format: password }
        confirm_password: { type: string, format: password }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetWithCodeRequest:
      type: object
      required: [reset_code, new_password]
      properties:
        reset_code: { type: string }
        new_password: { type: string, format: password }

    ActivateRequest:
      type: object
      required: [email, token, password]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, format: password }

    MeResponse:
      type: object
      properties:
        admin_id: { type: string }
        email: { type: string }
        role_id: { type: integer, nullable: true }

    # --- lookup: region/division/unit ---
    TitleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }

    RegionResponse:
      type: object
      properties:
        region_id: { type: integer }
        region_title: { type: string }
        region_create_date: { type: string, format: date-time }

    DivisionResponse:
      type: object
      properties:
        division_id: { type: integer }
        division_title: { type: string }
        created_at: { type: string, format: date-time }

    UnitResponse:
      type: object
      properties:
        unit_id: { type: integer }
        unit_title: { type: string }
        unit_create_date: { type: string, format: date-time }

    # --- ppn ---
    PpnRequest:
      type: object
      required: [value]
      properties:
        value:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Persentase, mis. 11 = 11%

    PpnResponse:
      type: object
      properties:
        ppn_id: { type: integer }
        ppn_value: { type: number, format: double }
        ppn_create_date: { type: string, format: date-time }

    # --- role & access (RBAC) ---
    RoleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        access_ids:
          type: array
          items: { type: integer }

    RoleResponse:
      type: object
      properties:
        role_id: { type: integer }
        role_title: { type: string }
        role_slug: { type: string }
        role_create_date: { type: string, format: date-time }
        total_access: { type: integer }

    RoleDetailResponse:
      type: object
      properties:
        role: { $ref: "#/components/schemas/RoleResponse" }
        access_ids:
          type: array
          items: { type: integer }

    AccessRequest:
      type: object
      required: [title, module, slug]
      properties:
        title: { type: string }
        module: { type: string, example: "po" }
        slug: { type: string, example: "edit_po" }

    AccessResponse:
      type: object
      properties:
        access_id: { type: integer }
        access_title: { type: string }
        access_slug: { type: string }
        access_module: { type: string }
        access_sort: { type: integer }
        access_create_date: { type: string, format: date-time }

    # --- admin ---
    CreateAdminRequest:
      type: object
      required: [email, username, region_id]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        role_id: { type: integer, nullable: true }
        region_id: { type: integer }
        pic: { type: string, enum: [yes, "no"], default: "no" }
        pic_client: { type: string, enum: [yes, "no"], default: "no" }

    UpdateAdminRequest:
      type: object
      required: [email, username]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        role_id: { type: integer, nullable: true }
        region_id: { type: integer }
        pic: { type: string, enum: [yes, "no"] }
        pic_client: { type: string, enum: [yes, "no"] }

    AdminResponse:
      type: object
      description: >
        Tidak pernah menyertakan admin_password, admin_token, atau
        admin_reset_code.
      properties:
        admin_id: { type: string }
        admin_email: { type: string }
        admin_name: { type: string }
        admin_active: { type: string, enum: [active, inactive] }
        admin_pic: { type: string, enum: [yes, "no"] }
        admin_pic_client: { type: string, enum: [yes, "no"] }
        admin_ref_role: { type: integer, nullable: true }
        role_title: { type: string }
        admin_ref_region: { type: integer }
        region_title: { type: string }
        admin_img: { type: string }
        admin_img_thmb: { type: string }
        admin_create_date: { type: string, format: date-time }

    # --- client ---
    ClientRequest:
      type: object
      required: [name, email, region_id]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        region_id: { type: integer }

    ClientResponse:
      type: object
      description: >
        Tidak pernah menyertakan client_password, client_token, atau
        client_reset_code.
      properties:
        client_id: { type: integer }
        client_name: { type: string }
        client_phone: { type: string }
        client_email: { type: string }
        client_active: { type: string, enum: [yes, "no"] }
        client_address: { type: string }
        client_ref_region: { type: integer }
        region_title: { type: string }
        client_create_date: { type: string, format: date-time }

    ClientSelectResponse:
      type: object
      properties:
        client_id: { type: integer }
        client_name: { type: string }
        client_email: { type: string }
        client_phone: { type: string }

    # --- purchase order ---
    CreatePOItemRequest:
      type: object
      required: [product, qty, unit_id]
      properties:
        desc: { type: string }
        product: { type: string }
        qty: { type: integer, minimum: 1 }
        unit_id: { type: integer }
        price: { type: number, format: double, minimum: 0 }

    CreatePORequest:
      type: object
      required: [order_num, region_id, pic_id, ppn_id, date, items]
      properties:
        order_num: { type: string }
        region_id: { type: integer }
        pic_id:
          type: string
          description: Admin yang menangani project/PO
        pic_client_id:
          type: string
          description: >
            Opsional. Admin yang menangani relasi ke klien, terpisah dari
            pic_id (PIC project). Kosongkan kalau PO ini tidak punya PIC
            client spesifik.
        division_id: { type: integer, nullable: true }
        ppn_id: { type: integer }
        date: { type: string, format: date }
        client_id:
          type: integer
          description: "0 atau tidak diisi = klien baru (wajib isi client_name & client_email)"
        client_name: { type: string }
        client_email: { type: string, format: email }
        client_phone: { type: string }
        client_address: { type: string }
        sub_client: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CreatePOItemRequest" }

    UpdatePORequest:
      type: object
      required: [order_num]
      properties:
        order_num: { type: string }
        region_id: { type: integer }
        pic_id:
          type: string
          description: Admin yang menangani project/PO
        pic_client_id:
          type: string
          description: >
            Opsional. Admin yang menangani relasi ke klien. Kirim string
            kosong untuk menghapus PIC client dari PO ini.
        division_id: { type: integer, nullable: true }
        date: { type: string, format: date }
        client_id: { type: integer }
        client_name: { type: string }
        client_email: { type: string, format: email }
        client_phone: { type: string }
        client_address: { type: string }
        sub_client: { type: string }

    POItemRequest:
      type: object
      required: [product, qty, unit_id]
      properties:
        desc: { type: string }
        product: { type: string }
        qty: { type: integer, minimum: 1 }
        unit_id: { type: integer }
        price: { type: number, format: double, minimum: 0 }

    ChangeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, progress, prepared, complete, cancel]

    ChangePaidRequest:
      type: object
      required: [paid]
      properties:
        paid: { type: string, enum: [yes, "no"] }

    UpdateInvoiceRequest:
      type: object
      required: [invoice]
      properties:
        invoice: { type: string }

    UpdateNotesRequest:
      type: object
      properties:
        notes: { type: string }

    POItemResponse:
      type: object
      properties:
        item_id: { type: integer }
        item_product: { type: string }
        item_desc: { type: string }
        item_qty: { type: integer }
        item_price: { type: number, format: double }
        unit_title: { type: string }

    POResponse:
      type: object
      properties:
        po_id: { type: string }
        po_order_num: { type: string }
        po_invoice: { type: string }
        po_status:
          type: string
          enum: [open, progress, prepared, complete, cancel]
        po_document: { type: string, enum: [yes, "no"] }
        po_paid: { type: string, enum: [yes, "no"] }
        po_notes: { type: string }
        po_subclient: { type: string }
        po_subtotal: { type: number, format: double }
        po_ppn_rate: { type: number, format: double }
        po_ppn_amount: { type: number, format: double }
        po_total: { type: number, format: double }
        po_item_total: { type: integer }
        client_name: { type: string }
        client_email: { type: string }
        client_phone: { type: string }
        client_address: { type: string }
        admin_name: { type: string }
        pic_name: { type: string, description: "Nama admin PIC project (po_ref_pic)" }
        pic_client_name: { type: string, description: "Nama admin PIC client (po_ref_pic_client), kosong kalau tidak diisi" }
        region_title: { type: string }
        division_title: { type: string }
        po_date: { type: string, format: date }
        po_exp_date: { type: string, format: date }
        po_prepared_date: { type: string, format: date-time }
        po_progress_date: { type: string, format: date-time }
        po_complete_date: { type: string, format: date-time }
        po_cancel_date: { type: string, format: date-time }
        po_create_date: { type: string, format: date-time }
        po_modify_date: { type: string, format: date-time }

    POWithItemsResponse:
      type: object
      properties:
        po: { $ref: "#/components/schemas/POResponse" }
        items:
          type: array
          items: { $ref: "#/components/schemas/POItemResponse" }

    POListItemResponse:
      type: object
      description: Representasi ringkas 1 baris PO untuk endpoint list/dashboard.
      properties:
        po_id: { type: string }
        po_order_num: { type: string }
        po_invoice: { type: string }
        po_status: { type: string }
        po_total: { type: number, format: double }
        po_document: { type: string }
        po_paid: { type: string }
        po_subclient: { type: string }
        po_date: { type: string, format: date }
        po_exp_date: { type: string, format: date }
        client_name: { type: string }
        pic_name: { type: string, description: "Nama admin PIC project" }
        pic_client_name: { type: string, description: "Nama admin PIC client, kosong kalau tidak diisi" }
        division_title: { type: string }
        region_title: { type: string }
        product_names:
          type: array
          items: { type: string }
          description: Seluruh nama produk pada PO ini (untuk konteks hasil pencarian berdasarkan produk)

    StatusCounts:
      type: object
      properties:
        open: { type: integer }
        progress: { type: integer }
        prepared: { type: integer }
        complete: { type: integer }
        cancel: { type: integer }

    # --- activity ---
    ActivityResponse:
      type: object
      properties:
        activity_id: { type: integer }
        activity_ref_po: { type: string }
        activity_type:
          type: string
          example: "progress"
          description: "open/progress/prepared/complete/cancel/notes/edit/add/delete/upload/dst"
        activity_notes: { type: string }
        activity_create_date: { type: string, format: date-time }
        admin_name: { type: string }
        admin_img: { type: string }

    # --- document ---
    DocumentResponse:
      type: object
      properties:
        document_id: { type: integer }
        document_ref_po: { type: string }
        document_title: { type: string }
        document_file: { type: string }
        document_create_date: { type: string, format: date-time }

    # --- dashboard ---
    DashboardSummaryResponse:
      type: object
      properties:
        total_open: { type: integer }
        total_progress: { type: integer }
        total_prepared: { type: integer }
        total_complete: { type: integer }
        total_cancel: { type: integer }
        total_paid: { type: integer }
        total_unpaid: { type: integer }
        recent_open_po:
          type: array
          items: { $ref: "#/components/schemas/POListItemResponse" }

    PermissionsResponse:
      type: object
      properties:
        access_slugs:
          type: array
          items: { type: string }
          example: ["create_po", "edit_po", "delete_client"]