        "409":
          description: Email sudah terdaftar

  /api/admins/pic:
    get:
      tags: [Admin]
      summary: List kandidat PIC internal (untuk dropdown pembuatan PO)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminResponse" }

  /api/admins/pic-client:
    get:
      tags: [Admin]
      summary: List admin dengan flag PIC client
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AdminResponse" }

  /api/admins/me/signature:
    get:
      tags: [Signature]
      summary: Tanda tangan terdaftar milik admin yang sedang login
      description: >
        Mengembalikan tanda tangan TERBARU milik admin (bisa lebih dari satu
        di histori). Dipakai sebagai syarat sebelum submit PR (prepared by)
        maupun approve PR.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/SignatureResponse" }
        "404":
          description: Admin belum memiliki tanda tangan terdaftar
    post:
      tags: [Signature]
      summary: Unggah tanda tangan baru
      description: >
        Multipart/form-data, field `file` (png/jpg/jpeg, maks 5MB, magic
        number divalidasi) dan `name_pic` (nama yang tercetak di bawah
        tanda tangan pada dokumen RFP). Setiap upload baru menjadi tanda
        tangan TERBARU (histori lama tetap tersimpan, tidak ditimpa).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name_pic]
              properties:
                file:
                  type: string
                  format: binary
                name_pic:
                  type: string
      responses:
        "201":
          description: Tanda tangan berhasil diunggah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          signature_id: { type: integer }
                          file: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/admins/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPathString"
    get:
      tags: [Admin]
      summary: Detail admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AdminResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Admin]
      summary: Ubah data admin
      description: "Butuh access_slug: `edit_other_admin`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email sudah terdaftar
    delete:
      tags: [Admin]
      summary: Hapus admin
      description: >
        Butuh access_slug: `delete_admin`. Tidak bisa menghapus akun sendiri.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          description: Tidak dapat menghapus akun sendiri
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admins/{id}/image:
    parameters:
      - $ref: "#/components/parameters/IdPathString"
    post:
      tags: [Admin]
      summary: Upload foto profil admin
      description: "Butuh access_slug: `edit_pic`. Multipart/form-data, field `image` (jpg/jpeg/png/gif, maks 10MB)."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Foto berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          image: { type: string }
                          image_thumb: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admins/{id}/resend-activation:
    parameters:
      - $ref: "#/components/parameters/IdPathString"
    post:
