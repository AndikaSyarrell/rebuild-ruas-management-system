  # =========================================================
  # PURCHASE ORDER
  # =========================================================
  /api/po:
    get:
      tags: [Purchase Order]
      summary: List PO (filter status/keyword/region/tanggal/sort)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: 'Default "open"'
          schema:
            type: string
            enum: [open, progress, prepared, complete, cancel]
        - name: keyword
          in: query
          description: >
            Mencari berdasarkan nomor PO, PO ID, nama klien, sub-client,
            ATAU nama produk pada salah satu item PO.
          schema: { type: string }
        - name: region
          in: query
          schema: { type: integer }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: sortby
          in: query
          schema: { type: string, enum: [old, new] }
        - name: acsg_pic
          in: query
          description: "Set = 1 untuk membatasi hasil ke PO milik admin yang login (sebagai PIC)"
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/POListItemResponse" }
    post:
      tags: [Purchase Order]
      summary: Buat PO baru (beserta item)
      description: "Butuh access_slug: `create_po`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePORequest" }
      responses:
        "201":
          description: PO berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          po_id: { type: string, example: "PO250716123045-A1B2" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Nomor PO sudah terdaftar

  /api/po/export:
    get:
      tags: [Purchase Order]
      summary: Export breakdown per-item PO ke Excel (.xlsx)
      description: >
        Butuh access_slug: `export_po`. Response berupa file binary
        (application/vnd.openxmlformats-officedocument.spreadsheetml.sheet),
        di-cache di disk selama 20 menit berdasarkan kombinasi filter.
        Header `X-Export-Cache: HIT|MISS` menandai apakah dari cache.
      parameters:
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: division
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: region
          in: query
          schema: { type: integer }
        - name: client
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: File .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Gagal membuat file export

  /api/po/total:
    get:
      tags: [Purchase Order]
      summary: Ringkasan jumlah PO per status (untuk badge)
      parameters:
        - name: region
          in: query
          schema: { type: integer }
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/StatusCounts" }

  /api/po/{id}:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [Purchase Order]
      summary: Detail PO beserta item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/POWithItemsResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Purchase Order]
      summary: Ubah header PO (tanpa item)
      description: "Butuh access_slug: `edit_po`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePORequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Nomor PO sudah terdaftar
    delete:
      tags: [Purchase Order]
      summary: Hapus PO (cascade ke item, dokumen, aktivitas)
      description: "Butuh access_slug: `delete_po`"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/status:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [Purchase Order]
      summary: Ubah status PO
      description: "Butuh access_slug: `change_stat_po`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeStatusRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/paid:
    parameters:
