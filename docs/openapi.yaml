                        items: { $ref: "#/components/schemas/AdminResponse" }
    post:
      tags: [Admin]
      summary: Buat admin baru (kirim email aktivasi)
      description: "Butuh access_slug: `create_new_admin`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminRequest" }
      responses:
