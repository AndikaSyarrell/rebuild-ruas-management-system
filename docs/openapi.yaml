  # =========================================================
  # PURCHASE ORDER
  # =========================================================
  /api/po:
    get:
      tags: [Purchase Order]
      summary: List PO (filter status/keyword/region/tanggal/sort)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          description: 'Default "open"'
          schema:
            type: string
            enum: [open, progress, prepared, complete, cancel]
        - name: keyword
          in: query
          description: >
            Mencari berdasarkan nomor PO, PO ID, nama klien, sub-client,
            ATAU nama produk pada salah satu item PO.
          schema: { type: string }
        - name: region
          in: query
          schema: { type: integer }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: sortby
          in: query
          schema: { type: string, enum: [old, new] }
        - name: acsg_pic
          in: query
          description: "Set = 1 untuk membatasi hasil ke PO milik admin yang login (sebagai PIC)"
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/POListItemResponse" }
    post:
      tags: [Purchase Order]
      summary: Buat PO baru (beserta item)
      description: "Butuh access_slug: `create_po`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePORequest" }
      responses:
        "201":
          description: PO berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          po_id: { type: string, example: "PO250716123045-A1B2" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Nomor PO sudah terdaftar

  /api/po/export:
    get:
      tags: [Purchase Order]
      summary: Export breakdown per-item PO ke Excel (.xlsx)
      description: >
        Butuh access_slug: `export_po`. Response berupa file binary
        (application/vnd.openxmlformats-officedocument.spreadsheetml.sheet),
        di-cache di disk selama 20 menit berdasarkan kombinasi filter.
        Header `X-Export-Cache: HIT|MISS` menandai apakah dari cache.
      parameters:
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: division
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: region
          in: query
          schema: { type: integer }
        - name: client
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: File .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Gagal membuat file export

  /api/po/total:
    get:
      tags: [Purchase Order]
      summary: Ringkasan jumlah PO per status (untuk badge)
      parameters:
        - name: region
          in: query
          schema: { type: integer }
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/StatusCounts" }

  /api/po/{id}:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [Purchase Order]
      summary: Detail PO beserta item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/POWithItemsResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Purchase Order]
      summary: Ubah header PO (tanpa item)
      description: "Butuh access_slug: `edit_po`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePORequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Nomor PO sudah terdaftar
    delete:
      tags: [Purchase Order]
      summary: Hapus PO (cascade ke item, dokumen, aktivitas; link quotation dicabut otomatis)
      description: >
        Butuh access_slug: `delete_po`. Dalam satu transaksi: link quotation
        ke PO ini dicabut, `pr_po_no` PR anggota dikosongkan, dan komentar
        audit bertipe `po_unlink` dicatat pada tiap PR anggota sebelum PO
        dihapus.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/po/{id}/status:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [Purchase Order]
      summary: Ubah status PO
      description: >
        Butuh access_slug: `change_stat_po`. Mengubah status ke `cancel`
        atau kembali ke `open` DITOLAK (409) selama PO masih ter-link ke
        quotation - cabut link dulu lewat `unlink-quotation`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeStatusRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: PO masih ter-link ke quotation (untuk status cancel/open)

  /api/po/{id}/paid:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [Purchase Order]
      summary: Ubah status pembayaran PO
      description: "Butuh access_slug: `change_stat_paid`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePaidRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/invoice:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [Purchase Order]
      summary: Set/ubah nomor invoice PO
      description: "Butuh access_slug: `update_invoice`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvoiceRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [Purchase Order]
      summary: Ubah catatan header PO
      description: "Butuh access_slug: `update_po_notes`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotesRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/items:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [PO Items]
      summary: List item PO
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/POItemResponse" }
    post:
      tags: [PO Items]
      summary: Tambah item PO (otomatis recompute total)
      description: "Butuh access_slug: `edit_po`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/POItemRequest" }
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/po/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [PO Items]
      summary: Ubah item PO (otomatis recompute total)
      description: "Butuh access_slug: `edit_po`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/POItemRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [PO Items]
      summary: Hapus item PO (otomatis recompute total)
      description: "Butuh access_slug: `edit_po`"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================
  # ACTIVITY
  # =========================================================
  /api/po/{id}/quotation-candidates:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [PO Quotation Link]
      summary: Daftar quotation yang belum ter-link ke PO (kandidat link)
      description: >
        Butuh access_slug: `link_pr_po`. Maks 50 hasil. Bila `keyword`
        kosong dan PO punya hint (`po_quot_no`), hint dipakai sebagai
        keyword; bila hint tidak menemukan apa pun, seluruh kandidat
        ditampilkan. `eligible` = minimal satu PR anggota berstatus
        `completed` (syarat link).
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/QuotationCandidateResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/link-quotation:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [PO Quotation Link]
      summary: Link grup quotation ke PO
      description: >
        Butuh access_slug: `link_pr_po`. Syarat: PO berstatus `prepared`
        (service saat ini mensyaratkan persis `prepared`), quotation belum
        ter-link ke PO lain, dan minimal satu PR anggota `completed`.
        Dalam satu transaksi, `pr_po_no` seluruh PR anggota diisi dengan
        nomor PO.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkQuotationRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: PO atau quotation tidak ditemukan
        "409":
          description: >
            PO belum berstatus prepared, quotation sudah ter-link ke PO
            (lain), atau belum ada PR anggota yang `completed`

  /api/po/{id}/linked-quotations:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [PO Quotation Link]
      summary: Daftar grup quotation yang sudah ter-link ke PO
      description: >
        Dipakai pada halaman detail/edit PO. Tidak butuh access_slug
        khusus (sama seperti GET /api/po/{id}), cukup login. Setiap item
        berisi ringkasan grup beserta jumlah PR anggota (`total_pr`).
        Daftar PR di dalam grup diambil terpisah lewat endpoint
        `/api/po/{id}/linked-quotations/{quotationId}/prs` saat grup di-click.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/LinkedQuotationSummaryResponse" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/po/{id}/linked-quotations/{quotationId}/prs:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
      - name: quotationId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [PO Quotation Link]
      summary: Daftar PR anggota sebuah grup quotation yang ter-link ke PO
      description: >
        Dipanggil saat grup quotation di-click pada halaman detail/edit PO.
        Tidak butuh access_slug khusus, cukup login. Quotation harus
        benar-benar ter-link ke PO pada path, jika tidak dikembalikan 404
        (mencegah akses lintas PO lewat tebak ID). Terurut dari PR terlama.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/QuotationPRResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Quotation tidak ditemukan, atau tidak ter-link ke PO ini

  /api/po/{id}/unlink-quotation:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [PO Quotation Link]
      summary: Cabut link quotation dari PO
      description: >
        Butuh access_slug: `unlink_pr_po`. `notes` WAJIB (audit trail
        permanen: dicatat sebagai komentar bertipe `po_unlink` pada setiap
        PR anggota). `pr_po_no` seluruh PR anggota dikosongkan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlinkQuotationRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          description: Validasi gagal, atau quotation tidak ter-link ke PO ini
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Quotation tidak ditemukan

  /api/po/{id}/quot-hint:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [PO Quotation Link]
      summary: Set / hapus hint nomor quotation pada PO
      description: >
        Butuh access_slug: `edit_po`. Hint dinormalisasi (trim + uppercase);
        kosong = hapus hint. Hanya petunjuk pencarian kandidat, bukan link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuotHintRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/po/{id}/activities:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [Activity]
      summary: Histori aktivitas sebuah PO
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ActivityResponse" }

  /api/po/{id}/notes-activity:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [Activity]
      summary: Tambah catatan bebas sebagai entri aktivitas
      description: "Butuh access_slug: `create_notes`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/activities/dashboard:
    get:
      tags: [Activity]
      summary: Feed aktivitas status-changing terbaru lintas PO
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ActivityResponse" }

  # =========================================================
  # DOCUMENT
  # =========================================================
  /api/po/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [Document]
      summary: List dokumen PO
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DocumentResponse" }
    post:
      tags: [Document]
      summary: Upload dokumen PO
      description: >
        Butuh access_slug: `upload_document`. Multipart/form-data.
        Format: pdf, doc, docx, jpg, jpeg, png, gif (maks 10MB). Isi file
        divalidasi via magic number, bukan cuma ekstensi nama file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  description: Opsional, default nama file asli
      responses:
        "201":
          description: Dokumen berhasil diunggah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          document_id: { type: integer }
                          file: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/po/{id}/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Document]
      summary: Hapus dokumen PO
      description: "Butuh access_slug: `upload_document`"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/po/{id}/documents/{docId}/download:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Document]
      summary: Unduh / tampilkan file dokumen PO
      description: "Mengalirkan file dengan `Content-Disposition: inline`."
      responses:
        "200":
          description: File dokumen
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: File dokumen kosong/rusak di server

  # =========================================================
  # RESPONSIBLE (Chart of Accounts)
  # =========================================================
  /api/responsibles:
    get:
      tags: [Responsible]
      summary: List responsible (dengan paginasi & pencarian)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ResponsibleResponse" }
    post:
      tags: [Responsible]
      summary: Buat responsible baru
      description: "Butuh access_slug: `create_responsible`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibleRequest" }
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Kode CoA sudah terdaftar

  /api/responsibles/select:
    get:
      tags: [Responsible]
      summary: List responsible aktif untuk dropdown pembuatan/edit PR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ResponsibleResponse" }

  /api/responsibles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Responsible]
      summary: Detail responsible
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ResponsibleResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Responsible]
      summary: Ubah responsible
      description: "Butuh access_slug: `edit_responsible`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibleRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Kode CoA sudah terdaftar
    delete:
      tags: [Responsible]
      summary: Hapus responsible
      description: >
        Butuh access_slug: `delete_responsible`. Akan gagal (FK constraint)
        bila responsible ini masih dipakai oleh purchase request manapun.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Gagal dihapus (kemungkinan masih dipakai PR lain)

  /api/responsibles/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Responsible]
      summary: Aktifkan responsible
      description: "Butuh access_slug: `change_stat_responsible`"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/responsibles/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Responsible]
      summary: Nonaktifkan responsible
      description: >
        Butuh access_slug: `change_stat_responsible`. Responsible nonaktif
        tidak muncul lagi di `/api/responsibles/select`, namun PR lama yang
        sudah memakainya tidak terpengaruh.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"

  # =========================================================
  # PURCHASE REQUEST (PR)
  # =========================================================
  /api/pr:
    get:
      tags: [Purchase Request]
      summary: List purchase request
      description: >
        Hanya menampilkan PR yang boleh dilihat aktor: requester sendiri,
        approver/pemutus pada PR tsb, admin finance yang mencatat/
        mengonfirmasi pembayarannya, director (setelah level 1 approved),
        dan finance (setelah level 2 approved atau bila ada request
        pembatalan). Jika query `status` diisi, mengembalikan SELURUH baris
        berstatus tsb tanpa paginasi (`data.paged: false`, daftar ada di
        `data.data`). Jika kosong, mengembalikan hasil paginasi standar.
      parameters:
        - name: status
          in: query
          description: "draft | submitted | approved | rejected | revision | completed | cancelled"
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK (paginasi standar bila `status` kosong)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Purchase Request]
      summary: Buat purchase request baru (status awal draft)
      description: >
        Butuh access_slug: `create_pr`. Admin pembuat WAJIB sudah terhubung
        ke divisi (untuk penomoran RFP: `<kode divisi>-<urut 3 digit><tahun>`).
        `payments` opsional: baris pembayaran yang direncanakan di muka,
        tersimpan berstatus `draft` dan baru aktif (`pending`) setelah PR
        ini disetujui penuh.


        **Quotation**: `qout_no` dinormalisasi (trim + uppercase). Bila
        nomor sudah dipakai grup PR lain, server membalas 409 berisi
        detail grup (`QuotationConflictResponse`); kirim ulang dengan
        `confirm_join_quotation: true` untuk bergabung. Bila `ref_previous_pr`
        sudah punya quotation, PR ini otomatis mewarisinya.


        **Nomor PO** (`po_no`) ditentukan dengan prioritas: (1) PO yang
        ter-link ke grup quotation, (2) nomor yang diisi requester (harus
        ada di RMS dan berstatus prepared/progress/complete), (3) warisan
        dari PR sebelumnya, (4) kosong -> ditampilkan "PO BELUM RELEASE".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePRRequest" }
      responses:
        "201":
          description: Purchase request berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pr_id: { type: integer }
        "400":
          description: >
            Validasi gagal, PR referensi tidak ditemukan / beda responsible /
            membentuk siklus, `qout_no` berbeda dengan quotation chain PR
            sebelumnya, atau nomor PO tidak ditemukan di RMS
        "403":
          description: Referensi PR sebelumnya bukan milik admin ini
        "409":
          description: >
            (a) Admin belum terhubung ke divisi; (b) nomor quotation sudah
            dipakai grup lain - `data` berisi `QuotationConflictResponse`,
            ulangi dengan `confirm_join_quotation: true`; (c) responsible
            berbeda dengan responsible grup quotation; (d) PO tidak
            berstatus prepared/progress/complete; (e) nomor PO berbeda
            dengan PO yang ter-link ke grup quotation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/QuotationConflictResponse" }

  /api/pr/quotations:
    get:
      tags: [Purchase Request]
      summary: Cari nomor quotation (autocomplete pada form PR)
      description: >
        Butuh access_slug: `create_pr`. Maks 10 hasil. `keyword` kosong
        mengembalikan array kosong.
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/QuotationCandidateResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/pr/po-options:
    get:
      tags: [Purchase Request]
      summary: Daftar nomor PO yang dapat dipakai pada form PR
      description: >
        Hanya PO berstatus `prepared`, `progress`, atau `complete`. Pencarian
        pada nomor PO, hint quotation, sub-client, nama klien, atau nama
        produk item.


        > **Catatan**: handler `SearchPOOptions` sudah ada, tetapi route ini
        > belum terdaftar di `routes.go` - daftarkan `rt.Get("/po-options", ...)`
        > pada grup `/pr` agar endpoint ini dapat diakses.
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/POLinkOptionResponse" }

  /api/pr/link-check:
    get:
      tags: [Purchase Request]
      summary: Validasi hubungan nomor quotation dan nomor PO pada form PR
      description: >
        Hasil validasi ada di `data.level` (`info` | `ok` | `warning` |
        `error`) dan `data.code`, BUKAN di status HTTP - 200 berarti
        pemeriksaan berhasil dijalankan. Juga mengembalikan responsible
        (CoA) yang harus dikunci (`data.responsible`) berdasarkan anggota
        grup quotation / PO.


        > **Catatan**: handler `CheckLink` sudah ada, tetapi route ini belum
        > terdaftar di `routes.go` - daftarkan `rt.Get("/link-check", ...)`
        > pada grup `/pr`.
      parameters:
        - name: qout_no
          in: query
          schema: { type: string }
        - name: po_no
          in: query
          schema: { type: string }
        - name: exclude_pr_id
          in: query
          description: PR yang sedang diedit (tidak dihitung saat menentukan responsible grup)
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LinkCheckResponse" }

  /api/pr/my-approvals:
    get:
      tags: [PR Approval]
      summary: Daftar baris approval yang menunggu keputusan admin ini
      description: >
        Hanya baris pada round terbaru PR berstatus `submitted`, dan hanya
        yang sudah "gilirannya" (level 1, atau level sebelumnya `approved`).
        Level 1 = checker yang ditugaskan; level 2/3 = admin aktif yang
        memegang access_slug sesuai `approval_type` (director/finance) dan
        bukan requester PR tsb.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRApprovalResponse" }

  /api/pr/my-decisions:
    get:
      tags: [PR Approval]
      summary: Riwayat keputusan approval yang sudah dibuat admin ini
      parameters:
        - name: decision
          in: query
          schema: { type: string, enum: [approved, rejected, revision_requested] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRDecisionHistoryResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/pr/bulk-submit:
    post:
      tags: [Purchase Request]
      summary: Submit banyak PR sekaligus (maks 50)
      description: >
        Butuh access_slug: `submit_pr`. Tiap item diproses mandiri dengan
        aturan yang sama seperti `POST /api/pr/{id}/submit`; kegagalan satu
        item tidak membatalkan item lain. Hasil per item ada di `data`.
        `checker_id` per item menimpa `default_checker_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkSubmitPRRequest" }
      responses:
        "200":
          description: Bulk submit selesai (lihat `success` per item)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BulkSubmitResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/pr/approvals/bulk-decide:
    post:
      tags: [PR Approval]
      summary: Approve / reject banyak baris approval sekaligus (maks 50)
      description: >
        Butuh salah satu access_slug: `checker`, `director`, `finance`.
        Aturan per item sama seperti approve/reject tunggal (sequential,
        tanda tangan wajib untuk approve, reject hanya level 1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkDecideApprovalRequest" }
      responses:
        "200":
          description: Bulk selesai (lihat `success` per item)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BulkDecideResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/pr/cancel-requests:
    get:
      tags: [PR Cancel]
      summary: Antrean review request pembatalan (finance)
      description: >
        Butuh access_slug: `finance`. Default `status=pending`. Pending
        selalu di atas (terlama dulu), sisanya terbaru dulu.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, all], default: pending }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRCancelRequestResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/pr/cancel-requests/{cancelId}/document:
    parameters:
      - name: cancelId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [PR Cancel]
      summary: Lihat berita acara request pembatalan
      description: Hanya pengaju request atau admin dengan access_slug `finance`. Dikirim inline.
      responses:
        "200":
          description: File berita acara
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pr/cancel-requests/{cancelId}/approve:
    parameters:
      - name: cancelId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Cancel]
      summary: Setujui request pembatalan (finance)
      description: >
        Butuh access_slug: `finance`. Dalam satu transaksi: request ->
        `approved`, payment `draft`/`pending` -> `cancelled`, PR ->
        `cancelled`, riwayat status dicatat. Finance tidak boleh mereview
        request miliknya sendiri; PR dengan pembayaran `paid` tidak dapat
        dibatalkan.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PRCancelReviewRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Finance tidak dapat mereview request miliknya sendiri
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Request sudah direview, status PR tidak memungkinkan pembatalan, atau ada pembayaran lunas

  /api/pr/cancel-requests/{cancelId}/reject:
    parameters:
      - name: cancelId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Cancel]
      summary: Tolak request pembatalan (finance)
      description: "Butuh access_slug: `finance`. `notes` (alasan penolakan) WAJIB, maks 500 karakter."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PRCancelReviewRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Finance tidak dapat mereview request miliknya sendiri
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Request sudah direview

  /api/pr/payments/export:
    get:
      tags: [PR Payment]
      summary: Export summary payment PR (.xlsx)
      description: >
        Butuh access_slug: `export_pr_payment_report`. `start_date` dan
        `end_date` harus diisi bersamaan (filter pada tanggal dibuatnya
        payment). Subtotal per responsible hanya menghitung payment `paid`.
      parameters:
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, cancelled, draft] }
        - name: responsible
          in: query
          description: ID responsible (CoA)
          schema: { type: integer }
        - name: user
          in: query
          description: admin_id requester PR
          schema: { type: string }
      responses:
        "200":
          description: File xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/pr/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Purchase Request]
      summary: Detail purchase request
      description: Hanya admin yang boleh melihat PR ini (lihat aturan visibilitas pada `GET /api/pr`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PRResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Purchase Request]
      summary: Ubah purchase request
      description: >
        Butuh access_slug: `edit_pr`. Hanya requester pemilik yang boleh
        mengubah, dan hanya selama status `draft` atau `revision`.


        Nomor quotation terkunci setelah PR tergabung ke grup quotation.
        `po_no`: tidak dikirim = tidak diubah; string kosong = dihapus.
        `payments`: bila dikirim, menggantikan seluruh rencana pembayaran
        berstatus `draft`; bila tidak dikirim, tidak diubah.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePRRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bukan pemilik PR, atau referensi PR sebelumnya bukan milik admin ini
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            PR bukan draft/revision; nomor quotation sudah terkunci; nomor
            quotation dipakai grup lain (`data` = `QuotationConflictResponse`,
            ulangi dengan `confirm_join_quotation: true`); responsible
            berbeda dengan grup quotation; atau validasi nomor PO gagal

  /api/pr/{id}/export:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Purchase Request]
      summary: Export dokumen RFP (.docx)
      description: >
        Butuh access_slug: `export_pr`. Menghasilkan dokumen Request For
        Payment lengkap dengan tanda tangan prepared/checked/approved by
        (bila tersedia) sebagai file `.docx` siap unduh.
      responses:
        "200":
          description: File docx
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Purchase request tidak ditemukan

  /api/pr/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [PR Cancel]
      summary: Batalkan purchase request secara langsung
      description: >
        Hanya requester pemilik. Pembatalan LANGSUNG hanya bila PR belum
        lolos checker: status `draft`, `revision`, atau `submitted` dengan
        level 1 belum `approved` pada round berjalan.


        Bila checker sudah approve (atau PR sudah `approved`), server
        membalas 409 dengan `data.code = "cancel_request_required"` -
        gunakan `POST /api/pr/{id}/cancel-request`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelPRRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bukan pemilik PR
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            PR sudah final (completed/rejected/cancelled), atau perlu request
            pembatalan (`data.code = "cancel_request_required"`)

  /api/pr/{id}/cancel-request:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [PR Cancel]
      summary: Ajukan request pembatalan (PR sudah lolos checker)
      description: >
        Multipart/form-data. `file` = berita acara (pdf/doc/docx/jpg/jpeg/png,
        maks 10MB, magic number divalidasi) dan `reason` = ringkasan alasan
        (maks 1200 karakter). Hanya requester pemilik; hanya untuk PR
        `submitted` (level 1 sudah approved) atau `approved`. Request
        menunggu review finance; hanya boleh ada satu request `pending`
        per PR.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, reason]
              properties:
                file: { type: string, format: binary }
                reason: { type: string, maxLength: 1200 }
      responses:
        "201":
          description: Request pembatalan berhasil diajukan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cancel_id: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bukan pemilik PR
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            PR sudah final; PR masih dapat dibatalkan langsung
            (`data.code = "cancel_direct_allowed"`); atau sudah ada request
            yang menunggu review

  /api/pr/{id}/cancel-requests:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Cancel]
      summary: Riwayat request pembatalan untuk satu PR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRCancelRequestResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/pr/{id}/history:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Purchase Request]
      summary: Riwayat perubahan status PR
      responses:
        "403":
          description: Admin tidak boleh melihat PR ini
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRHistoryResponse" }

  /api/pr/{id}/approvals:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Approval]
      summary: Daftar seluruh baris approval PR (lintas round)
      description: Terurut round terbaru dahulu lalu level ascending.
      responses:
        "403":
          description: Admin tidak boleh melihat PR ini
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRApprovalResponse" }

  /api/pr/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Purchase Request]
      summary: Submit PR untuk approval
      description: >
        Butuh access_slug: `submit_pr`. Requester memilih SATU checker
        (level 1) dan tanda tangannya sendiri (`signature_id`). Level 2
        (`director`) dan level 3 (`finance`) dibuat otomatis tanpa
        penugasan orang tertentu - siapa pun yang memegang slug tsb
        (selain requester) dapat memutuskan.


        Syarat: checker aktif & punya slug `checker` serta bukan requester;
        tanda tangan milik requester; `requested_amount` di atas Rp
        50.000.000 wajib sudah melampirkan dokumen `cost_control`. Hanya
        dari status `draft` atau `revision`; tiap submit membuat round baru.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitPRRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          description: Validasi gagal, checker tidak valid, atau checker = requester
        "403":
          description: PR atau tanda tangan bukan milik admin yang login
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            PR tidak eligible untuk submit, requester belum punya tanda
            tangan terdaftar, atau dokumen cost_control wajib belum dilampirkan

  /api/pr/{id}/amounts:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Purchase Request]
      summary: Perbarui nominal PO amount, HPP, dan nomor PO (margin dihitung otomatis)
      description: >
        Butuh access_slug: `update_pr_amounts`. `po_amount` dan `hpp`
        disimpan; `pr_margin` (= po_amount - hpp) dan
        `pr_margin_percentage` (= margin / po_amount * 100, aman terhadap
        pembagian nol) SELALU dihitung ulang saat response.


        `po_no` opsional: kosong = nomor PO tidak diubah. Bila PR sudah
        tergabung ke grup quotation yang ter-link ke PO, `po_no` tidak
        boleh diubah lewat endpoint ini (409) - ubah lewat proses linking PO.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePRAmountsRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PRResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PR sudah ter-link ke PO lewat quotation

  /api/pr/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Purchase Request]
      summary: Daftar komentar PR
      description: >
        Hanya bisa diakses admin yang terkait dengan PR ini (requester,
        approver di round manapun, atau finance yang mencatat/mengonfirmasi
        pembayarannya).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRCommentResponse" }
        "403":
          description: Admin tidak terkait dengan PR ini
    post:
      tags: [Purchase Request]
      summary: Tambah komentar pada PR
      description: >
        Naratif bebas, TIDAK memicu perubahan status PR (berbeda dari
        catatan revisi formal pada approval_notes). Sama seperti list,
        hanya admin yang terkait dengan PR ini yang boleh menambah komentar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PRCommentRequest" }
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Admin tidak terkait dengan PR ini
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pr/approvals/{approvalId}/approve:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Approval]
      summary: Setujui baris approval
      description: >
        Butuh salah satu access_slug: `checker`, `director`, `finance`.
        Level 1 hanya boleh oleh checker yang ditugaskan; level 2/3 oleh
        admin yang memegang slug sesuai `approval_type` dan bukan requester.
        Sequential (level N baru bisa diputuskan setelah level N-1 pada
        round yang sama `approved`) dan approver harus punya tanda tangan
        terdaftar (tanda tangan TERBARU dipakai). Jika ini level tertinggi
        pada round tsb, PR otomatis `approved` dan payment draft diaktifkan
        (`pending`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecidePRApprovalRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: >
            Baris approval bukan milik admin ini, tidak punya akses untuk
            tahap ini, atau approver = requester
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Level sebelumnya belum disetujui, PR tidak lagi `submitted`,
            baris sudah diputuskan, atau approver belum punya tanda tangan

  /api/pr/approvals/{approvalId}/reject:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Approval]
      summary: Tolak baris approval (hanya tahap checker / level 1)
      description: >
        Butuh salah satu access_slug: `checker`, `director`, `finance`.
        Reject HANYA boleh pada level 1 (checker); level 2/3 membalas 403.
        PR langsung berpindah ke status `rejected`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecidePRApprovalRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Baris approval bukan milik admin ini, atau reject tidak diizinkan pada level ini
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PR tidak lagi `submitted`, atau baris sudah diputuskan

  /api/pr/approvals/{approvalId}/request-revision:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Approval]
      summary: Minta revisi PR (hanya checker / level 1)
      description: >
        Butuh access_slug: `request_revision_pr`. Hanya checker level 1
        yang ditugaskan pada baris tsb. PR berpindah ke status `revision`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecidePRApprovalRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Baris approval bukan milik admin ini, atau level ini tidak berwenang meminta revisi
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PR tidak lagi `submitted`, atau baris sudah diputuskan

  /api/pr/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Document]
      summary: Daftar dokumen lampiran PR
      responses:
        "403":
          description: Admin tidak boleh melihat PR ini
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRDocumentResponse" }
    post:
      tags: [PR Document]
      summary: Unggah dokumen lampiran PR
      description: >
        Multipart/form-data. Hanya requester pemilik PR yang boleh
        melampirkan dokumen. Field `document_type` salah satu dari:
        `cost_control`, `quotation`, `invoice`, `contract`, `other`
        (default `other`). Field `file`: pdf/doc/docx/jpg/jpeg/png, maks
        10MB, magic number divalidasi terhadap tipe yang diklaim.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                document_type:
                  type: string
                  enum: [cost_control, quotation, invoice, contract, other]
      responses:
        "201":
          description: Dokumen berhasil diunggah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          document_id: { type: integer }
                          file: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bukan requester pemilik PR
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pr/{id}/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [PR Document]
      summary: Hapus dokumen lampiran PR
      description: Hanya admin yang mengunggah dokumen tsb yang boleh menghapusnya.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Bukan pengunggah dokumen ini
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pr/{id}/documents/{docId}/download:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [PR Document]
      summary: Unduh file dokumen lampiran PR
      description: >
        Mengalirkan file mentah dari storage dengan
        `Content-Disposition: attachment`, sehingga browser client selalu
        menawarkan simpan-sebagai (dipakai untuk aksi "download" pada UI).
      responses:
        "200":
          description: File dokumen
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Dokumen tidak ditemukan (metadata maupun file fisik di server)
        "500":
          description: File dokumen kosong/rusak di server, atau gagal dibaca informasinya

  /api/pr/{id}/documents/{docId}/preview:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [PR Document]
      summary: Pratinjau file dokumen lampiran PR
      description: >
        Sama seperti download, tapi mengirim
        `Content-Disposition: inline` (dengan `Content-Type` sesuai
        ekstensi file - pdf/jpg/jpeg/png) sehingga file dapat ditampilkan
        langsung di dalam browser/tab, bukan diunduh sebagai attachment.
      responses:
        "200":
          description: File dokumen (ditampilkan inline)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: Dokumen tidak ditemukan (metadata maupun file fisik di server)
        "500":
          description: File dokumen kosong/rusak di server, atau gagal dibaca informasinya

  /api/pr/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Payment]
      summary: Daftar pembayaran PR ini
      responses:
        "403":
          description: Admin tidak boleh melihat PR ini
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRPaymentResponse" }
    post:
      tags: [PR Payment]
      summary: Catat tahap pembayaran baru
      description: >
        Butuh access_slug: `create_pr_payment`. PR harus sudah berstatus
        `approved` sebelum pembayarannya dapat dicatat. Pembayaran baru
        berstatus `pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePRPaymentRequest" }
      responses:
        "201":
          description: Pembayaran berhasil dicatat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          payment_id: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PR harus berstatus approved sebelum dapat dicatat pembayarannya

  /api/pr/{id}/payment-chain:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Payment]
      summary: Riwayat pembayaran lintas rantai PR (PR referensi berantai)
      description: >
        Menyusuri `pr_ref_previous_pr` mundur (maks 20 tingkat) dan
        mengembalikan pembayaran tiap tahap dalam rantai tsb, terguna untuk
        PR lanjutan yang mereferensikan PR-PR sebelumnya (mis. termin).
      responses:
        "403":
          description: Admin tidak boleh melihat PR ini
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRPaymentChainStage" }

  /api/pr/payments/{paymentId}/confirm:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Payment]
      summary: Konfirmasi pembayaran lunas
      description: >
        Butuh access_slug: `confirm_pr_payment`. Menerapkan prinsip
        maker-checker: admin yang mengonfirmasi TIDAK BOLEH sama dengan
        admin yang mencatat pembayaran ini. Jika seluruh pembayaran PR
        sudah lunas, PR otomatis berpindah ke status `completed`.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Admin yang mencatat tidak boleh merangkap mengonfirmasi pembayaran yang sama
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pembayaran ini masih draft, sudah lunas, atau sudah dibatalkan sebelumnya

  /api/pr/payments/{paymentId}/cancel:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Payment]
      summary: Batalkan tahap pembayaran
      description: >
        Butuh access_slug: `confirm_pr_payment`. Pembayaran yang sudah
        `paid` tidak dapat dibatalkan lewat jalur ini.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelPRPaymentRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pembayaran yang sudah lunas atau sudah dibatalkan tidak dapat diproses lagi

  /api/pr/payments/{paymentId}/priority-date:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Payment]
      summary: Atur tanggal prioritas pembayaran
      description: >
        Butuh access_slug: `finance`. Hanya untuk pembayaran berstatus
        `pending`. `priority_date` kosong = hapus tanggal prioritas. Aktor
        harus boleh melihat PR pemilik pembayaran.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPaymentPriorityDateRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pembayaran tidak berstatus pending

  # =========================================================
  # DASHBOARD
  # =========================================================
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Ringkasan dashboard (jumlah per status + PO terbuka terbaru)
      parameters:
        - name: region
          in: query
          schema: { type: integer }
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DashboardSummaryResponse" }

  # =========================================================
  # REPORT
  # =========================================================
  /api/reports/years:
    get:
      tags: [Report]
      summary: Daftar tahun yang memiliki data PO
      description: >
        Butuh access_slug: `view_report_table`.
        Dipakai untuk mengisi dropdown filter tahun di halaman chart/bars -
        hanya mengembalikan tahun yang benar-benar punya data PO (bukan range
        tahun statis), terurut dari yang paling baru.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          years:
                            type: array
                            items: { type: integer }
                            example: [2026, 2025, 2024]
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/chart:
    get:
      tags: [Report]
      summary: Data chart jumlah PO per tanggal
      description: >
        Butuh access_slug: `view_report_table`.


        **Prioritas filter tanggal:**
        1. Jika `start_date` DAN `end_date` sama-sama diisi → filter memakai
           rentang tanggal tersebut apa adanya (inklusif), parameter `year`
           diabaikan untuk filtering (tetap boleh dikirim, hanya dicatat di
           response).
        2. Jika `year` diisi (dan salah satu/kedua `start_date`/`end_date`
           kosong) → filter memakai 1 tahun kalender penuh dari `year`
           tersebut.
        3. Jika tidak ada parameter tanggal sama sekali → default ke tahun
           PO paling baru (lihat `GET /api/reports/years` untuk daftar
           pilihannya).


        Mengirim hanya salah satu dari `start_date`/`end_date` (tanpa
        pasangannya) akan ditolak dengan `400`.
      parameters:
        - name: year
          in: query
          description: Filter 1 tahun kalender penuh. Diabaikan jika start_date & end_date diisi lengkap.
          schema: { type: integer, example: 2026 }
        - name: start_date
          in: query
          description: Wajib diisi bersamaan dengan end_date.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Wajib diisi bersamaan dengan start_date.
          schema: { type: string, format: date }
        - name: region
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          year:
                            type: integer
                            description: Tahun yang benar-benar dipakai untuk filter. Bernilai 0 jika filter memakai start_date/end_date (bukan year).
                            example: 2026
                          start_date:
                            type: string
                            format: date
                            description: Kosong jika filter memakai year (bukan date-scope eksplisit).
                          end_date:
                            type: string
                            format: date
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string, format: date }
                                total: { type: integer }
        "400":
          description: start_date/end_date tidak lengkap (hanya salah satu yang diisi)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    example:
                      success: false
                      message: "start_date dan end_date harus diisi bersamaan"
                      data: null
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/bars:
    get:
      tags: [Report]
      summary: Data grafik total nilai PO per region
      description: >
        Butuh access_slug: `view_report_table`.
        Aturan prioritas filter tanggal (`year` vs `start_date`/`end_date`)
        sama persis seperti `GET /api/reports/chart` - lihat deskripsi di
        endpoint tersebut.
      parameters:
        - name: year
          in: query
          description: Filter 1 tahun kalender penuh. Diabaikan jika start_date & end_date diisi lengkap.
          schema: { type: integer, example: 2026 }
        - name: start_date
          in: query
          description: Wajib diisi bersamaan dengan end_date.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Wajib diisi bersamaan dengan start_date.
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          year:
                            type: integer
                            description: Tahun yang benar-benar dipakai untuk filter. Bernilai 0 jika filter memakai start_date/end_date (bukan year).
                            example: 2026
                          start_date:
                            type: string
                            format: date
                          end_date:
                            type: string
                            format: date
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                region_id:
                                  type: integer
                                  description: 0 jika PO tidak lagi terhubung ke region manapun (region sudah terhapus).
                                region_title:
                                  type: string
                                  description: String kosong jika region_id 0 (lihat catatan di atas).
                                total_amount: { type: number, format: double }
        "400":
          description: start_date/end_date tidak lengkap (hanya salah satu yang diisi)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    example:
                      success: false
                      message: "start_date dan end_date harus diisi bersamaan"
                      data: null
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/stats:
    get:
      tags: [Report]
      summary: Statistik PO per region (breakdown per status)
      description: >
        Butuh access_slug: `view_report_table`.
        Endpoint ini TIDAK mendukung filter tahun/tanggal - selalu
        mengagregasi seluruh data PO (opsional dibatasi per PIC lewat
        `acsg_pic`).
      parameters:
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            region_id: { type: integer }
                            region_title: { type: string }
                            total_po: { type: integer }
                            total_open: { type: integer }
                            total_prepared: { type: integer }
                            total_progress: { type: integer }
                            total_complete: { type: integer }
                            total_cancel: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

# =========================================================
# COMPONENTS
# =========================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPage:
      name: item
      in: query
      description: Jumlah item per halaman (maks 200)
      schema: { type: integer, default: 10, maximum: 200 }
    IdPathInt:
      name: id
      in: path
      required: true
      schema: { type: integer }
    IdPathString:
      name: id
      in: path
      required: true
      schema: { type: string }
    PoIdPath:
      name: id
      in: path
      required: true
      description: PO ID (format sequential, mis. PO250716123045-A1B2)
      schema: { type: string }

  responses:
    OK:
      description: Berhasil
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Created:
      description: Berhasil dibuat
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    BadRequest:
      description: Permintaan tidak valid (validasi gagal)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Unauthorized:
      description: Tidak terautentikasi (token hilang/invalid/expired)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Forbidden:
      description: Tidak memiliki hak akses (access_slug tidak dimiliki role)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    RegionListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RegionResponse" }
    DivisionListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DivisionResponse" }
    UnitListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnitResponse" }

  schemas:
    # --- generic wrappers ---
    ApiResponseBase:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
      example:
        success: true
        message: "Fetch success"
        data: {}

    PaginationMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            total_data: { type: integer }
            total_page: { type: integer }
            page: { type: integer }

    ReadyzResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            database: { type: string, example: "ok" }
            redis: { type: string, example: "ok" }

    # --- auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPairResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: "Bearer" }
        expires_in: { type: integer, description: "detik" }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPairResponse"
        - type: object
          properties:
            admin: { $ref: "#/components/schemas/AdminResponse" }

    ResetPasswordRequest:
      type: object
      required: [old_password, new_password, confirm_password]
      properties:
        old_password: { type: string, format: password }
        new_password: { type: string, format: password }
        confirm_password: { type: string, format: password }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetWithCodeRequest:
      type: object
      required: [reset_code, new_password]
      properties:
        reset_code: { type: string }
        new_password: { type: string, format: password }

    ActivateRequest:
      type: object
      required: [email, token, password]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, format: password }

    MeResponse:
      type: object
      properties:
        admin_id: { type: string }
        email: { type: string }
        role_id: { type: integer, nullable: true }

    # --- lookup: region/division/unit ---
    TitleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }

    RegionResponse:
      type: object
      properties:
        region_id: { type: integer }
        region_title: { type: string }
        region_create_date: { type: string, format: date-time }

    DivisionResponse:
      type: object
      properties:
        division_id: { type: integer }
        division_title: { type: string }
        created_at: { type: string, format: date-time }

    UnitResponse:
      type: object
      properties:
        unit_id: { type: integer }
        unit_title: { type: string }
        unit_create_date: { type: string, format: date-time }

    # --- ppn ---
    PpnRequest:
      type: object
      required: [value]
      properties:
        value:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Persentase, mis. 11 = 11%

    PpnResponse:
      type: object
      properties:
        ppn_id: { type: integer }
        ppn_value: { type: number, format: double }
        ppn_create_date: { type: string, format: date-time }

    # --- role & access (RBAC) ---
    RoleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        access_ids:
          type: array
          items: { type: integer }

    RoleResponse:
      type: object
      properties:
        role_id: { type: integer }
        role_title: { type: string }
        role_slug: { type: string }
        role_create_date: { type: string, format: date-time }
        total_access: { type: integer }

    RoleDetailResponse:
      type: object
      properties:
        role: { $ref: "#/components/schemas/RoleResponse" }
        access_ids:
          type: array
          items: { type: integer }

    AccessRequest:
      type: object
      required: [title, module, slug]
      properties:
        title: { type: string }
        module: { type: string, example: "po" }
        slug: { type: string, example: "edit_po" }

    AccessResponse:
      type: object
      properties:
        access_id: { type: integer }
        access_title: { type: string }
        access_slug: { type: string }
        access_module: { type: string }
        access_sort: { type: integer }
        access_create_date: { type: string, format: date-time }

    # --- admin ---
    CreateAdminRequest:
      type: object
      required: [email, username, region_id]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        role_id: { type: integer, nullable: true }
        region_id: { type: integer }
        division_id: { type: integer, nullable: true }
        pic: { type: string, enum: [yes, "no"], default: "no" }
        pic_client: { type: string, enum: [yes, "no"], default: "no" }

    UpdateAdminRequest:
      type: object
      required: [email, username]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        role_id: { type: integer, nullable: true }
        region_id: { type: integer }
        division_id: { type: integer, nullable: true }
        pic: { type: string, enum: [yes, "no"] }
        pic_client: { type: string, enum: [yes, "no"] }

    AdminResponse:
      type: object
      description: >
        Tidak pernah menyertakan admin_password, admin_token, atau
        admin_reset_code.
      properties:
        admin_id: { type: string }
        admin_email: { type: string }
        admin_name: { type: string }
        admin_active: { type: string, enum: [active, inactive] }
        admin_pic: { type: string, enum: [yes, "no"] }
        admin_pic_client: { type: string, enum: [yes, "no"] }
        admin_ref_role: { type: integer, nullable: true }
        role_title: { type: string }
        admin_ref_region: { type: integer }
        region_title: { type: string }
        admin_ref_division: { type: integer, nullable: true }
        division_title: { type: string }
        admin_img: { type: string }
        admin_img_thmb: { type: string }
        admin_create_date: { type: string, format: date-time }

    # --- client ---
    ClientRequest:
      type: object
      required: [name, email, region_id]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        region_id: { type: integer }

    ClientResponse:
      type: object
      description: >
        Tidak pernah menyertakan client_password, client_token, atau
        client_reset_code.
      properties:
        client_id: { type: integer }
        client_name: { type: string }
        client_phone: { type: string }
        client_email: { type: string }
        client_active: { type: string, enum: [yes, "no"] }
        client_address: { type: string }
        client_ref_region: { type: integer }
        region_title: { type: string }
        client_create_date: { type: string, format: date-time }

    ClientSelectResponse:
      type: object
      properties:
        client_id: { type: integer }
        client_name: { type: string }
        client_email: { type: string }
        client_phone: { type: string }

    # --- purchase order ---
    CreatePOItemRequest:
      type: object
      required: [product, qty, unit_id]
      properties:
        desc: { type: string }
        product: { type: string }
        qty: { type: integer, minimum: 1 }
        unit_id: { type: integer }
        price: { type: number, format: double, minimum: 0 }

    CreatePORequest:
      type: object
      required: [order_num, region_id, pic_id, ppn_id, date, items]
      properties:
        order_num: { type: string }
        region_id: { type: integer }
        pic_id:
          type: string
          description: Admin yang menangani project/PO
        pic_client_id:
          type: string
          description: >
            Opsional. Admin yang menangani relasi ke klien, terpisah dari
            pic_id (PIC project). Kosongkan kalau PO ini tidak punya PIC
            client spesifik.
        division_id: { type: integer, nullable: true }
        ppn_id: { type: integer }
        date: { type: string, format: date }
        client_id:
          type: integer
          description: "0 atau tidak diisi = klien baru (wajib isi client_name & client_email)"
        client_name: { type: string }
        client_email: { type: string, format: email }
        client_phone: { type: string }
        client_address: { type: string }
        sub_client: { type: string }
        quot_no:
          type: string
          description: Opsional. Hint nomor quotation (dinormalisasi trim + uppercase)
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CreatePOItemRequest" }

    UpdatePORequest:
      type: object
      required: [order_num]
      properties:
        order_num: { type: string }
        region_id: { type: integer }
        pic_id:
          type: string
          description: Admin yang menangani project/PO
        pic_client_id:
          type: string
          description: >
            Opsional. Admin yang menangani relasi ke klien. Kirim string
            kosong untuk menghapus PIC client dari PO ini.
        division_id: { type: integer, nullable: true }
        date: { type: string, format: date }
        client_id: { type: integer }
        client_name: { type: string }
        client_email: { type: string, format: email }
        client_phone: { type: string }
        client_address: { type: string }
