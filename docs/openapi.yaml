    post:
      tags: [Purchase Order]
      summary: Ubah status pembayaran PO
      description: "Butuh access_slug: `change_stat_paid`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePaidRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/invoice:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [Purchase Order]
      summary: Set/ubah nomor invoice PO
      description: "Butuh access_slug: `update_invoice`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvoiceRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    post:
      tags: [Purchase Order]
      summary: Ubah catatan header PO
      description: "Butuh access_slug: `update_po_notes`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotesRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/po/{id}/items:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [PO Items]
      summary: List item PO
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/POItemResponse" }
    post:
      tags: [PO Items]
      summary: Tambah item PO (otomatis recompute total)
      description: "Butuh access_slug: `edit_po`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/POItemRequest" }
      responses:
