            progress/complete; bila grup quotation sudah ter-link ke PO,
            harus sama dengan PO tsb.
        confirm_join_quotation:
          type: boolean
          description: Set true untuk bergabung ke grup quotation yang sudah dipakai PR lain
        ref_previous_pr:
          type: integer
          nullable: true
          description: >
            Opsional. PR referensi (mis. termin lanjutan) - harus milik
