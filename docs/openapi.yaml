        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ActivityResponse" }

  # =========================================================
  # DOCUMENT
  # =========================================================
  /api/po/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
    get:
      tags: [Document]
      summary: List dokumen PO
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DocumentResponse" }
    post:
      tags: [Document]
      summary: Upload dokumen PO
      description: >
        Butuh access_slug: `upload_document`. Multipart/form-data.
        Format: pdf, doc, docx, jpg, jpeg, png, gif (maks 10MB). Isi file
        divalidasi via magic number, bukan cuma ekstensi nama file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  description: Opsional, default nama file asli
      responses:
        "201":
          description: Dokumen berhasil diunggah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          document_id: { type: integer }
                          file: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/po/{id}/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/PoIdPath"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Document]
      summary: Hapus dokumen PO
      description: "Butuh access_slug: `upload_document`"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================
  # RESPONSIBLE (Chart of Accounts)
  # =========================================================
  /api/responsibles:
    get:
      tags: [Responsible]
      summary: List responsible (dengan paginasi & pencarian)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ResponsibleResponse" }
    post:
      tags: [Responsible]
      summary: Buat responsible baru
      description: "Butuh access_slug: `create_responsible`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibleRequest" }
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Kode CoA sudah terdaftar

  /api/responsibles/select:
    get:
      tags: [Responsible]
      summary: List responsible aktif untuk dropdown pembuatan/edit PR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ResponsibleResponse" }

  /api/responsibles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Responsible]
      summary: Detail responsible
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ResponsibleResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Responsible]
      summary: Ubah responsible
      description: "Butuh access_slug: `edit_responsible`"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponsibleRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Kode CoA sudah terdaftar
    delete:
      tags: [Responsible]
      summary: Hapus responsible
      description: >
        Butuh access_slug: `delete_responsible`. Akan gagal (FK constraint)
        bila responsible ini masih dipakai oleh purchase request manapun.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Gagal dihapus (kemungkinan masih dipakai PR lain)

  /api/responsibles/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Responsible]
      summary: Aktifkan responsible
      description: "Butuh access_slug: `change_stat_responsible`"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/responsibles/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Responsible]
      summary: Nonaktifkan responsible
      description: >
        Butuh access_slug: `change_stat_responsible`. Responsible nonaktif
        tidak muncul lagi di `/api/responsibles/select`, namun PR lama yang
        sudah memakainya tidak terpengaruh.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Forbidden"

  # =========================================================
  # PURCHASE REQUEST (PR)
  # =========================================================
  /api/pr:
    get:
      tags: [Purchase Request]
      summary: List purchase request
      description: >
        Jika query `status` diisi, mengembalikan SELURUH baris berstatus
        tsb tanpa paginasi (`paged: false`). Jika kosong, mengembalikan
        hasil paginasi standar.
      parameters:
        - name: status
          in: query
          description: "draft | submitted | approved | rejected | revision | completed | cancelled"
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRResponse" }
    post:
      tags: [Purchase Request]
      summary: Buat purchase request baru (status awal draft)
      description: >
        Butuh access_slug: `create_pr`. Admin pembuat WAJIB sudah terhubung
        ke divisi (untuk penomoran RFP) - lihat `admin_ref_division`.
        `payments` opsional: baris pembayaran yang sudah direncanakan di
        muka, tersimpan berstatus `draft` dan baru aktif (`pending`) setelah
        PR ini disetujui penuh.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePRRequest" }
      responses:
        "201":
          description: Purchase request berhasil dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pr_id: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Referensi PR sebelumnya bukan milik admin ini
        "409":
          description: >
            Admin belum terhubung ke divisi manapun, atau referensi PR
            sebelumnya tidak valid (tidak ditemukan/beda responsible/siklus)

  /api/pr/my-approvals:
    get:
      tags: [PR Approval]
      summary: Daftar baris approval yang menunggu keputusan admin ini
      description: >
        Hanya baris level 1, atau level > 1 yang level sebelumnya (round
        sama) sudah `approved` - approval yang belum "gilirannya" tidak
        ikut muncul.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRApprovalResponse" }

  /api/pr/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Purchase Request]
      summary: Detail purchase request
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PRResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Purchase Request]
      summary: Ubah purchase request
      description: >
        Butuh access_slug: `edit_pr`. Hanya requester pemilik yang boleh
        mengubah, dan hanya selama status `draft` atau `revision`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePRRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bukan pemilik PR, atau referensi PR sebelumnya bukan milik admin ini
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            PR sudah tidak berstatus draft/revision, atau referensi PR
            sebelumnya tidak valid

  /api/pr/{id}/export:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Purchase Request]
      summary: Export dokumen RFP (.docx)
      description: >
        Butuh access_slug: `export_pr`. Menghasilkan dokumen Request For
        Payment lengkap dengan tanda tangan prepared/checked/approved by
        (bila tersedia) sebagai file `.docx` siap unduh.
      responses:
        "200":
          description: File docx
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Purchase request tidak ditemukan

  /api/pr/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Purchase Request]
      summary: Batalkan purchase request
      description: >
        Hanya requester pemilik yang boleh membatalkan, dan hanya selama
        status `draft`, `revision`, atau `submitted`. PR yang sudah
        `approved`/`completed`/`rejected`/`cancelled` dianggap final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelPRRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bukan pemilik PR
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PR sudah pada status final dan tidak dapat dibatalkan

  /api/pr/{id}/history:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Purchase Request]
      summary: Riwayat perubahan status PR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRHistoryResponse" }

  /api/pr/{id}/approvals:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Approval]
      summary: Daftar seluruh baris approval PR (lintas round)
      description: Terurut round terbaru dahulu lalu level ascending.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRApprovalResponse" }

  /api/pr/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Purchase Request]
      summary: Submit PR untuk approval
      description: >
        Butuh access_slug: `submit_pr`. Mensyaratkan requester punya tanda
        tangan terdaftar (dipakai sebagai "prepared by"); approver level 1
        wajib disertakan; PR dengan `requested_amount` di atas Rp
        50.000.000 wajib sudah melampirkan dokumen bertipe `cost_control`.
        Hanya berlaku dari status `draft` atau `revision`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitPRRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: PR bukan milik admin yang login
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            PR tidak eligible untuk submit, level approval sudah pernah
            dibuat untuk round ini, requester belum punya tanda tangan
            terdaftar, atau dokumen cost_control wajib belum dilampirkan

  /api/pr/{id}/priority:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Purchase Request]
      summary: Atur priority PR
      description: >
        Butuh access_slug: `set_pr_priority`. Hanya approver level 1 pada
        round approval TERBARU PR ini yang boleh mengatur priority, dan
        tidak dapat diatur selama PR masih berstatus `draft`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPriorityRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bukan approver level 1 pada round terbaru
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Priority tidak dapat diatur selama draft, atau baris approval
            level 1 belum tersedia (PR belum pernah disubmit)

  /api/pr/{id}/amounts:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    post:
      tags: [Purchase Request]
      summary: Perbarui nominal PO amount & HPP (margin dihitung otomatis)
      description: >
        Butuh access_slug: `update_pr_amounts`. Hanya `po_amount` dan `hpp`
        yang disimpan; `pr_margin` (= po_amount - hpp) dan
        `pr_margin_percentage` (= margin / po_amount * 100, aman terhadap
        pembagian nol) SELALU dihitung ulang saat response, tidak pernah
        disimpan sebagai kolom terpisah.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePRAmountsRequest" }
      responses:
        "200":
          description: Nominal berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PRResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pr/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [Purchase Request]
      summary: Daftar komentar PR
      description: >
        Hanya bisa diakses admin yang terkait dengan PR ini (requester,
        approver di round manapun, atau finance yang mencatat/mengonfirmasi
        pembayarannya).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRCommentResponse" }
        "403":
          description: Admin tidak terkait dengan PR ini
    post:
      tags: [Purchase Request]
      summary: Tambah komentar pada PR
      description: >
        Naratif bebas, TIDAK memicu perubahan status PR (berbeda dari
        catatan revisi formal pada approval_notes). Sama seperti list,
        hanya admin yang terkait dengan PR ini yang boleh menambah komentar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PRCommentRequest" }
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Admin tidak terkait dengan PR ini
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pr/approvals/{approvalId}/approve:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Approval]
      summary: Setujui baris approval
      description: >
        Butuh access_slug: `approve_pr`. Mensyaratkan sequential (level N
        baru bisa diputuskan setelah level N-1 pada round yang sama
        `approved`) dan approver punya tanda tangan terdaftar. Jika ini
        adalah level tertinggi pada round tsb, PR otomatis berpindah ke
        status `approved` dan payment draft (jika ada) diaktifkan.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecidePRApprovalRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Baris approval ini bukan milik admin yang login
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Approval level sebelumnya belum disetujui, PR sudah tidak
            berstatus submitted, atau approver belum punya tanda tangan
            terdaftar

  /api/pr/approvals/{approvalId}/reject:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Approval]
      summary: Tolak baris approval
      description: >
        Butuh access_slug: `approve_pr`. PR langsung berpindah ke status
        `rejected` begitu satu level manapun menolak.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecidePRApprovalRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Baris approval ini bukan milik admin yang login
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval level sebelumnya belum disetujui, atau PR sudah tidak berstatus submitted

  /api/pr/approvals/{approvalId}/request-revision:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Approval]
      summary: Minta revisi PR
      description: >
        Butuh access_slug: `request_revision_pr`. Hanya approver level 1
        atau 2 yang berwenang meminta revisi (level 3/director tidak
        boleh). PR berpindah ke status `revision`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecidePRApprovalRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: >
            Baris approval ini bukan milik admin yang login, atau level ini
            (director) tidak berwenang meminta revisi
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval level sebelumnya belum disetujui, atau PR sudah tidak berstatus submitted

  /api/pr/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Document]
      summary: Daftar dokumen lampiran PR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRDocumentResponse" }
    post:
      tags: [PR Document]
      summary: Unggah dokumen lampiran PR
      description: >
        Multipart/form-data. Hanya requester pemilik PR yang boleh
        melampirkan dokumen. Field `document_type` salah satu dari:
        `cost_control`, `quotation`, `invoice`, `contract`, `other`
        (default `other`). Field `file`: pdf/doc/docx/jpg/jpeg/png, maks
        10MB, magic number divalidasi terhadap tipe yang diklaim.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                document_type:
                  type: string
                  enum: [cost_control, quotation, invoice, contract, other]
      responses:
        "201":
          description: Dokumen berhasil diunggah
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          document_id: { type: integer }
                          file: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Bukan requester pemilik PR
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pr/{id}/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [PR Document]
      summary: Hapus dokumen lampiran PR
      description: Hanya admin yang mengunggah dokumen tsb yang boleh menghapusnya.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Bukan pengunggah dokumen ini
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pr/{id}/documents/{docId}/download:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [PR Document]
      summary: Unduh file dokumen lampiran PR
      description: >
        Mengalirkan file mentah dari storage dengan
        `Content-Disposition: attachment`, sehingga browser client selalu
        menawarkan simpan-sebagai (dipakai untuk aksi "download" pada UI).
      responses:
        "200":
          description: File dokumen
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Dokumen tidak ditemukan (metadata maupun file fisik di server)
        "500":
          description: File dokumen kosong/rusak di server, atau gagal dibaca informasinya

  /api/pr/{id}/documents/{docId}/preview:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
      - name: docId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [PR Document]
      summary: Pratinjau file dokumen lampiran PR
      description: >
        Sama seperti download, tapi mengirim
        `Content-Disposition: inline` (dengan `Content-Type` sesuai
        ekstensi file - pdf/jpg/jpeg/png) sehingga file dapat ditampilkan
        langsung di dalam browser/tab, bukan diunduh sebagai attachment.
      responses:
        "200":
          description: File dokumen (ditampilkan inline)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: Dokumen tidak ditemukan (metadata maupun file fisik di server)
        "500":
          description: File dokumen kosong/rusak di server, atau gagal dibaca informasinya

  /api/pr/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Payment]
      summary: Daftar pembayaran PR ini
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRPaymentResponse" }
    post:
      tags: [PR Payment]
      summary: Catat tahap pembayaran baru
      description: >
        Butuh access_slug: `create_pr_payment`. PR harus sudah berstatus
        `approved` sebelum pembayarannya dapat dicatat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePRPaymentRequest" }
      responses:
        "201":
          description: Pembayaran berhasil dicatat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          payment_id: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: PR harus berstatus approved sebelum dapat dicatat pembayarannya

  /api/pr/{id}/payment-chain:
    parameters:
      - $ref: "#/components/parameters/IdPathInt"
    get:
      tags: [PR Payment]
      summary: Riwayat pembayaran lintas rantai PR (PR referensi berantai)
      description: >
        Menyusuri `pr_ref_previous_pr` mundur (maks 20 tingkat) dan
        mengembalikan pembayaran tiap tahap dalam rantai tsb, terguna untuk
        PR lanjutan yang mereferensikan PR-PR sebelumnya (mis. termin).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PRPaymentChainStage" }

  /api/pr/payments/{paymentId}/confirm:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Payment]
      summary: Konfirmasi pembayaran lunas
      description: >
        Butuh access_slug: `confirm_pr_payment`. Menerapkan prinsip
        maker-checker: admin yang mengonfirmasi TIDAK BOLEH sama dengan
        admin yang mencatat pembayaran ini. Jika seluruh pembayaran PR
        sudah lunas, PR otomatis berpindah ke status `completed`.
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          description: Admin yang mencatat tidak boleh merangkap mengonfirmasi pembayaran yang sama
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pembayaran ini masih draft, sudah lunas, atau sudah dibatalkan sebelumnya

  /api/pr/payments/{paymentId}/cancel:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [PR Payment]
      summary: Batalkan tahap pembayaran
      description: >
        Butuh access_slug: `confirm_pr_payment`. Pembayaran yang sudah
        `paid` tidak dapat dibatalkan lewat jalur ini.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelPRPaymentRequest" }
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pembayaran yang sudah lunas atau sudah dibatalkan tidak dapat diproses lagi

  # =========================================================
  # DASHBOARD
  # =========================================================
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Ringkasan dashboard (jumlah per status + PO terbuka terbaru)
      parameters:
        - name: region
          in: query
          schema: { type: integer }
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DashboardSummaryResponse" }

  # =========================================================
  # REPORT
  # =========================================================
  /api/reports/years:
    get:
      tags: [Report]
      summary: Daftar tahun yang memiliki data PO
      description: >
        Butuh access_slug: `view_report_table`.
        Dipakai untuk mengisi dropdown filter tahun di halaman chart/bars -
        hanya mengembalikan tahun yang benar-benar punya data PO (bukan range
        tahun statis), terurut dari yang paling baru.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          years:
                            type: array
                            items: { type: integer }
                            example: [2026, 2025, 2024]
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/chart:
    get:
      tags: [Report]
      summary: Data chart jumlah PO per tanggal
      description: >
        Butuh access_slug: `view_report_table`.


        **Prioritas filter tanggal:**
        1. Jika `start_date` DAN `end_date` sama-sama diisi → filter memakai
           rentang tanggal tersebut apa adanya (inklusif), parameter `year`
           diabaikan untuk filtering (tetap boleh dikirim, hanya dicatat di
           response).
        2. Jika `year` diisi (dan salah satu/kedua `start_date`/`end_date`
           kosong) → filter memakai 1 tahun kalender penuh dari `year`
           tersebut.
        3. Jika tidak ada parameter tanggal sama sekali → default ke tahun
           PO paling baru (lihat `GET /api/reports/years` untuk daftar
           pilihannya).


        Mengirim hanya salah satu dari `start_date`/`end_date` (tanpa
        pasangannya) akan ditolak dengan `400`.
      parameters:
        - name: year
          in: query
          description: Filter 1 tahun kalender penuh. Diabaikan jika start_date & end_date diisi lengkap.
          schema: { type: integer, example: 2026 }
        - name: start_date
          in: query
          description: Wajib diisi bersamaan dengan end_date.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Wajib diisi bersamaan dengan start_date.
          schema: { type: string, format: date }
        - name: region
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          year:
                            type: integer
                            description: Tahun yang benar-benar dipakai untuk filter. Bernilai 0 jika filter memakai start_date/end_date (bukan year).
                            example: 2026
                          start_date:
                            type: string
                            format: date
                            description: Kosong jika filter memakai year (bukan date-scope eksplisit).
                          end_date:
                            type: string
                            format: date
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string, format: date }
                                total: { type: integer }
        "400":
          description: start_date/end_date tidak lengkap (hanya salah satu yang diisi)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    example:
                      success: false
                      message: "start_date dan end_date harus diisi bersamaan"
                      data: null
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/bars:
    get:
      tags: [Report]
      summary: Data grafik total nilai PO per region
      description: >
        Butuh access_slug: `view_report_table`.
        Aturan prioritas filter tanggal (`year` vs `start_date`/`end_date`)
        sama persis seperti `GET /api/reports/chart` - lihat deskripsi di
        endpoint tersebut.
      parameters:
        - name: year
          in: query
          description: Filter 1 tahun kalender penuh. Diabaikan jika start_date & end_date diisi lengkap.
          schema: { type: integer, example: 2026 }
        - name: start_date
          in: query
          description: Wajib diisi bersamaan dengan end_date.
          schema: { type: string, format: date }
        - name: end_date
          in: query
          description: Wajib diisi bersamaan dengan start_date.
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          year:
                            type: integer
                            description: Tahun yang benar-benar dipakai untuk filter. Bernilai 0 jika filter memakai start_date/end_date (bukan year).
                            example: 2026
                          start_date:
                            type: string
                            format: date
                          end_date:
                            type: string
                            format: date
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                region_id:
                                  type: integer
                                  description: 0 jika PO tidak lagi terhubung ke region manapun (region sudah terhapus).
                                region_title:
                                  type: string
                                  description: String kosong jika region_id 0 (lihat catatan di atas).
                                total_amount: { type: number, format: double }
        "400":
          description: start_date/end_date tidak lengkap (hanya salah satu yang diisi)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    example:
                      success: false
                      message: "start_date dan end_date harus diisi bersamaan"
                      data: null
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reports/stats:
    get:
      tags: [Report]
      summary: Statistik PO per region (breakdown per status)
      description: >
        Butuh access_slug: `view_report_table`.
        Endpoint ini TIDAK mendukung filter tahun/tanggal - selalu
        mengagregasi seluruh data PO (opsional dibatasi per PIC lewat
        `acsg_pic`).
      parameters:
        - name: acsg_pic
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponseBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            region_id: { type: integer }
                            region_title: { type: string }
                            total_po: { type: integer }
                            total_open: { type: integer }
                            total_prepared: { type: integer }
                            total_progress: { type: integer }
                            total_complete: { type: integer }
                            total_cancel: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

# =========================================================
# COMPONENTS
# =========================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PerPage:
      name: item
      in: query
      description: Jumlah item per halaman (maks 200)
      schema: { type: integer, default: 10, maximum: 200 }
    IdPathInt:
      name: id
      in: path
      required: true
      schema: { type: integer }
    IdPathString:
      name: id
      in: path
      required: true
      schema: { type: string }
    PoIdPath:
      name: id
      in: path
      required: true
      description: PO ID (format sequential, mis. PO250716123045-A1B2)
      schema: { type: string }

  responses:
    OK:
      description: Berhasil
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Created:
      description: Berhasil dibuat
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    BadRequest:
      description: Permintaan tidak valid (validasi gagal)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Unauthorized:
      description: Tidak terautentikasi (token hilang/invalid/expired)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    Forbidden:
      description: Tidak memiliki hak akses (access_slug tidak dimiliki role)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiResponseBase" }
    RegionListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RegionResponse" }
    DivisionListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DivisionResponse" }
    UnitListPaged:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponseBase"
              - $ref: "#/components/schemas/PaginationMeta"
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnitResponse" }

  schemas:
    # --- generic wrappers ---
    ApiResponseBase:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
      example:
        success: true
        message: "Fetch success"
        data: {}

    PaginationMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            total_data: { type: integer }
            total_page: { type: integer }
            page: { type: integer }

    ReadyzResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            database: { type: string, example: "ok" }
            redis: { type: string, example: "ok" }

    # --- auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPairResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: "Bearer" }
        expires_in: { type: integer, description: "detik" }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPairResponse"
        - type: object
          properties:
            admin: { $ref: "#/components/schemas/AdminResponse" }

    ResetPasswordRequest:
      type: object
      required: [old_password, new_password, confirm_password]
      properties:
        old_password: { type: string, format: password }
        new_password: { type: string, format: password }
        confirm_password: { type: string, format: password }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetWithCodeRequest:
      type: object
      required: [reset_code, new_password]
      properties:
        reset_code: { type: string }
        new_password: { type: string, format: password }

    ActivateRequest:
      type: object
      required: [email, token, password]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, format: password }

    MeResponse:
      type: object
      properties:
        admin_id: { type: string }
        email: { type: string }
        role_id: { type: integer, nullable: true }

    # --- lookup: region/division/unit ---
    TitleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }

    RegionResponse:
      type: object
      properties:
        region_id: { type: integer }
        region_title: { type: string }
        region_create_date: { type: string, format: date-time }

    DivisionResponse:
      type: object
      properties:
        division_id: { type: integer }
        division_title: { type: string }
        created_at: { type: string, format: date-time }

    UnitResponse:
      type: object
      properties:
        unit_id: { type: integer }
        unit_title: { type: string }
        unit_create_date: { type: string, format: date-time }

    # --- ppn ---
    PpnRequest:
      type: object
      required: [value]
      properties:
        value:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Persentase, mis. 11 = 11%

    PpnResponse:
      type: object
      properties:
        ppn_id: { type: integer }
        ppn_value: { type: number, format: double }
        ppn_create_date: { type: string, format: date-time }

    # --- role & access (RBAC) ---
    RoleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        access_ids:
          type: array
          items: { type: integer }

    RoleResponse:
      type: object
      properties:
        role_id: { type: integer }
        role_title: { type: string }
        role_slug: { type: string }
        role_create_date: { type: string, format: date-time }
        total_access: { type: integer }

    RoleDetailResponse:
      type: object
      properties:
        role: { $ref: "#/components/schemas/RoleResponse" }
        access_ids:
          type: array
          items: { type: integer }

    AccessRequest:
      type: object
      required: [title, module, slug]
      properties:
        title: { type: string }
        module: { type: string, example: "po" }
        slug: { type: string, example: "edit_po" }

    AccessResponse:
      type: object
      properties:
        access_id: { type: integer }
        access_title: { type: string }
        access_slug: { type: string }
        access_module: { type: string }
        access_sort: { type: integer }
        access_create_date: { type: string, format: date-time }

    # --- admin ---
    CreateAdminRequest:
      type: object
      required: [email, username, region_id]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        role_id: { type: integer, nullable: true }
        region_id: { type: integer }
        pic: { type: string, enum: [yes, "no"], default: "no" }
        pic_client: { type: string, enum: [yes, "no"], default: "no" }

    UpdateAdminRequest:
      type: object
      required: [email, username]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        role_id: { type: integer, nullable: true }
        region_id: { type: integer }
        pic: { type: string, enum: [yes, "no"] }
        pic_client: { type: string, enum: [yes, "no"] }

    AdminResponse:
      type: object
      description: >
        Tidak pernah menyertakan admin_password, admin_token, atau
        admin_reset_code.
      properties:
        admin_id: { type: string }
        admin_email: { type: string }
        admin_name: { type: string }
        admin_active: { type: string, enum: [active, inactive] }
        admin_pic: { type: string, enum: [yes, "no"] }
        admin_pic_client: { type: string, enum: [yes, "no"] }
        admin_ref_role: { type: integer, nullable: true }
        role_title: { type: string }
        admin_ref_region: { type: integer }
        region_title: { type: string }
        admin_img: { type: string }
        admin_img_thmb: { type: string }
        admin_create_date: { type: string, format: date-time }

    # --- client ---
    ClientRequest:
      type: object
      required: [name, email, region_id]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        region_id: { type: integer }

    ClientResponse:
      type: object
      description: >
        Tidak pernah menyertakan client_password, client_token, atau
        client_reset_code.
      properties:
        client_id: { type: integer }
        client_name: { type: string }
        client_phone: { type: string }
        client_email: { type: string }
        client_active: { type: string, enum: [yes, "no"] }
        client_address: { type: string }
        client_ref_region: { type: integer }
        region_title: { type: string }
        client_create_date: { type: string, format: date-time }

    ClientSelectResponse:
      type: object
      properties:
        client_id: { type: integer }
        client_name: { type: string }
        client_email: { type: string }
        client_phone: { type: string }

    # --- purchase order ---
    CreatePOItemRequest:
      type: object
      required: [product, qty, unit_id]
      properties:
        desc: { type: string }
        product: { type: string }
        qty: { type: integer, minimum: 1 }
        unit_id: { type: integer }
        price: { type: number, format: double, minimum: 0 }

    CreatePORequest:
      type: object
      required: [order_num, region_id, pic_id, ppn_id, date, items]
      properties:
        order_num: { type: string }
        region_id: { type: integer }
        pic_id:
          type: string
          description: Admin yang menangani project/PO
        pic_client_id:
          type: string
          description: >
            Opsional. Admin yang menangani relasi ke klien, terpisah dari
            pic_id (PIC project). Kosongkan kalau PO ini tidak punya PIC
            client spesifik.
        division_id: { type: integer, nullable: true }
        ppn_id: { type: integer }
        date: { type: string, format: date }
        client_id:
          type: integer
          description: "0 atau tidak diisi = klien baru (wajib isi client_name & client_email)"
        client_name: { type: string }
        client_email: { type: string, format: email }
        client_phone: { type: string }
        client_address: { type: string }
        sub_client: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CreatePOItemRequest" }

    UpdatePORequest:
      type: object
      required: [order_num]
      properties:
        order_num: { type: string }
        region_id: { type: integer }
        pic_id:
          type: string
          description: Admin yang menangani project/PO
        pic_client_id:
          type: string
          description: >
            Opsional. Admin yang menangani relasi ke klien. Kirim string
            kosong untuk menghapus PIC client dari PO ini.
        division_id: { type: integer, nullable: true }
        date: { type: string, format: date }
        client_id: { type: integer }
        client_name: { type: string }
        client_email: { type: string, format: email }
        client_phone: { type: string }
        client_address: { type: string }
        sub_client: { type: string }

    POItemRequest:
      type: object
      required: [product, qty, unit_id]
      properties:
        desc: { type: string }
        product: { type: string }
        qty: { type: integer, minimum: 1 }
        unit_id: { type: integer }
        price: { type: number, format: double, minimum: 0 }

    ChangeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, progress, prepared, complete, cancel]

    ChangePaidRequest:
      type: object
      required: [paid]
      properties:
        paid: { type: string, enum: [yes, "no"] }

    UpdateInvoiceRequest:
      type: object
      required: [invoice]
      properties:
        invoice: { type: string }

